openapi: 3.1.0
info:
  title: Kenko Authentication
  description: >
    Microservicio de autenticación de Kenko. Contrato de los endpoints de
    recuperación de contraseña. Los errores siguen el formato
    `{ "error": { "code", "message", "correlationId" } }` con mensajes
    genéricos que no revelan información interna ni de cuentas.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Desarrollo local

paths:
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Solicitar el enlace de restablecimiento de contraseña
      description: >
        Identifica al usuario por documento (tipo + número). Responde siempre
        la misma respuesta (status, cuerpo y cabeceras), exista o no la
        cuenta, para impedir la enumeración de usuarios. Si la cuenta existe,
        genera un token de un solo uso (TTL 30 minutos) y publica el evento
        `PasswordResetRequested` mediante outbox transaccional. Rate limiting
        por IP y por documento con enfriamiento.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Respuesta idéntica exista o no la cuenta.
          headers:
            Cache-Control:
              description: no-store (impide cachear la respuesta).
              schema: { type: string, const: no-store }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Restablecer la contraseña con el token del enlace
      description: >
        El token llega en el BODY (nunca en la URL). Token inválido, expirado
        o ya usado producen un único error genérico `PASSWORD_RESET_INVALID`.
        El consumo del token y el cambio de contraseña son atómicos: dos
        peticiones concurrentes con el mismo token; solo una tiene éxito. La
        nueva contraseña no puede ser igual a la actual. Rate limiting por IP.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña restablecida. El token queda consumido.
          headers:
            Cache-Control:
              description: no-store (impide cachear la respuesta).
              schema: { type: string, const: no-store }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyData'
        '400':
          oneOf:
            - $ref: '#/components/responses/BadRequest'
            - $ref: '#/components/responses/ResetInvalid'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID de correlación. Si es válido se reutiliza; si no, se genera uno.
      schema: { type: string, format: uuid }

  headers:
    CorrelationId:
      description: Identificador de correlación de la respuesta.
      schema: { type: string }

  schemas:
    DocumentType:
      type: string
      enum: [CC, TI, CE, PA]
      description: Tipo de documento. Vocabulario ampliable.

    ForgotPasswordRequest:
      type: object
      required: [documentType, documentNumber]
      properties:
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentNumber:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[A-Z0-9]+$'
          description: Se normaliza (trim, sin separadores, mayúsculas) antes de validar.

    ResetPasswordRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token:
          type: string
          minLength: 1
          description: >
            Token opaco del enlace (base64url, 256 bits). Su formato no se
            valida aquí: cualquier cadena se busca por hash y un token
            desconocido produce `PASSWORD_RESET_INVALID`.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Nueva contraseña. No puede ser igual a la actual ni de la lista de comunes.
        confirmPassword:
          type: string
          description: Solo valida en el formulario; nunca se persiste.

    EmptyData:
      type: object
      properties:
        data: { type: object, additionalProperties: false }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - REGISTER_CONFLICT
                - PASSWORD_RESET_INVALID
                - RATE_LIMITED
                - INTERNAL_ERROR
            message: { type: string }
            correlationId: { type: string }

  responses:
    BadRequest:
      description: Entrada malformada o política de contraseña incumplida (`VALIDATION_ERROR`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ResetInvalid:
      description: >
        Token inválido, expirado o ya usado. Único error genérico
        (`PASSWORD_RESET_INVALID`): no distingue el motivo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Límite de solicitudes alcanzado (`RATE_LIMITED`). Incluye cabecera `Retry-After`.
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Cuerpo de la petición demasiado grande.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Error interno. Reintentar más tarde.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
